name: render-nexus-ep3-test

# Uji 144 frame film NEXUS ZERO Episode 3 "THE CHOICE" (Eevee, setting B7
# dengan DEVIASI TERUKUR: samples 6, bukan 8 — sama seperti Ep 1 / Ep 2):
# RONDE 3 (pasca Fix Ronde 2): 6 segmen x 24 frame, 24 job x 6 frame
#   - S4c wide, Blender 800-823: hero di y=28,5 terpisah dari duplikat?
#   - S6a ECU sentuhan, Blender 1080-1103: kamera 2,5 m + fokus = jarak,
#     tangan EVA masuk frame?
#   - S6b scar_wave, Blender 1160-1183: hero (bukan duplikat) di foreground?
#   - S7a ECU mata, Blender 1221-1244: fokus = jarak (1,55->2,2)?
#   - S8a langkah, Blender 1321-1344: hero terpisah dari barisan?
#   - S8b akhir, Blender 1416-1439: emisi dinding ikut dim -> hitam?
#   - 9:16 540x960 lensk 0.62 saja. Ronde 2: 44833187385 (144/144, S3/S4/S6b/
#     S8a LOLOS, S6a blur total, S8b akhir mentok mean 86).
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: "9x16", seg: "s4c-01", res_x: 540, res_y: 960, lensk: "0.62", start: 800, end: 805 }
          - { fmt: "9x16", seg: "s4c-02", res_x: 540, res_y: 960, lensk: "0.62", start: 806, end: 811 }
          - { fmt: "9x16", seg: "s4c-03", res_x: 540, res_y: 960, lensk: "0.62", start: 812, end: 817 }
          - { fmt: "9x16", seg: "s4c-04", res_x: 540, res_y: 960, lensk: "0.62", start: 818, end: 823 }
          - { fmt: "9x16", seg: "s6a-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1080, end: 1085 }
          - { fmt: "9x16", seg: "s6a-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1086, end: 1091 }
          - { fmt: "9x16", seg: "s6a-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1092, end: 1097 }
          - { fmt: "9x16", seg: "s6a-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1098, end: 1103 }
          - { fmt: "9x16", seg: "s6b-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1160, end: 1165 }
          - { fmt: "9x16", seg: "s6b-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1166, end: 1171 }
          - { fmt: "9x16", seg: "s6b-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1172, end: 1177 }
          - { fmt: "9x16", seg: "s6b-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1178, end: 1183 }
          - { fmt: "9x16", seg: "s7a-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1221, end: 1226 }
          - { fmt: "9x16", seg: "s7a-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1227, end: 1232 }
          - { fmt: "9x16", seg: "s7a-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1233, end: 1238 }
          - { fmt: "9x16", seg: "s7a-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1239, end: 1244 }
          - { fmt: "9x16", seg: "s8a-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1321, end: 1326 }
          - { fmt: "9x16", seg: "s8a-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1327, end: 1332 }
          - { fmt: "9x16", seg: "s8a-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1333, end: 1338 }
          - { fmt: "9x16", seg: "s8a-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1339, end: 1344 }
          - { fmt: "9x16", seg: "s8b-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1416, end: 1421 }
          - { fmt: "9x16", seg: "s8b-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1422, end: 1427 }
          - { fmt: "9x16", seg: "s8b-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1428, end: 1433 }
          - { fmt: "9x16", seg: "s8b-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1434, end: 1439 }
    env:
      FS_SAMPLES: "6"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core
          ldconfig -p | grep libEGL

      - name: Restore cached Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.5.3-linux-x64
          key: blender-4.5.3-linux-x64

      - name: Download Blender 4.5.3 LTS (cache miss only, with retries)
        # Pelajaran Ep 1 run 44600190210: download.blender.org sempat mengembalikan
        # halaman error 61 KB (bukan tarball ~300 MB) 3x berturut-turut — curl tanpa
        # -f menganggapnya sukses. Fix: curl -f, cek ukuran >200 MB sebelum tar,
        # fallback mirror OCF Berkeley.
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
            "https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
          )
          OK=0
          for URL in "${URLS[@]}"; do
            for i in 1 2 3; do
              echo "Download attempt $i from $URL"
              if curl -fSL --retry 3 --retry-delay 10 --retry-all-errors \
                  -o blender.tar.xz "$URL" \
                  && [ "$(stat -c%s blender.tar.xz)" -gt 200000000 ] \
                  && tar -tf blender.tar.xz >/dev/null; then
                echo "Download OK: $URL attempt $i ($(stat -c%s blender.tar.xz) bytes)"
                OK=1
                break 2
              fi
              echo "Download attempt $i from $URL failed, retrying in 30s..."
              rm -f blender.tar.xz
              sleep 30
            done
          done
          if [ "$OK" != 1 ]; then echo "FAIL: Blender download failed (primer + mirror)"; exit 1; fi
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render 6 frames
        run: |
          START=${{ matrix.start }}
          END=${{ matrix.end }}
          echo "Chunk ${{ matrix.fmt }}-${{ matrix.seg }}: frames $START-$END (cache-hit=${{ steps.cache-blender.outputs.cache-hit }})"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline-nexus/animate_nexus.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan pipeline-nexus/plan.json \
            --res ${{ matrix.res_x }} ${{ matrix.res_y }} --lensk ${{ matrix.lensk }} || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "CHUNK=${{ matrix.fmt }}-${{ matrix.seg }} CACHE_HIT=${{ steps.cache-blender.outputs.cache-hit }} FRAMES=$N/6 SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt 6 ]; then echo "FAIL: only $N/6 frames rendered"; exit 1; fi

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ep3-frames-${{ matrix.fmt }}-${{ matrix.seg }}
          path: out/f_*.png
          if-no-files-found: error
