name: render-nexus-ep3-test

# Uji 72 frame film NEXUS ZERO Episode 3 "THE CHOICE" (Eevee, setting B7
# dengan DEVIASI TERUKUR: samples 6, bukan 8 — sama seperti Ep 1 / Ep 2):
# RONDE 4 (mini, segmen yang belum pernah dites): 3 segmen x 24 frame,
# 12 job x 6 frame
#   - S2b denyut gerbang, Blender 150-173: putih vs merah satu frame?
#   - S5a tilt-up ke ambang, Blender 880-903: gerbang putih + kedip merah?
#   - S5b wide kedip, Blender 960-983: dinding putih berkedip merah?
#   - 9:16 540x960 lensk 0.62 saja. Ronde 3: 44834513493 (144/144, semua LOLOS).
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: "9x16", seg: "s2b-01", res_x: 540, res_y: 960, lensk: "0.62", start: 150, end: 155 }
          - { fmt: "9x16", seg: "s2b-02", res_x: 540, res_y: 960, lensk: "0.62", start: 156, end: 161 }
          - { fmt: "9x16", seg: "s2b-03", res_x: 540, res_y: 960, lensk: "0.62", start: 162, end: 167 }
          - { fmt: "9x16", seg: "s2b-04", res_x: 540, res_y: 960, lensk: "0.62", start: 168, end: 173 }
          - { fmt: "9x16", seg: "s5a-01", res_x: 540, res_y: 960, lensk: "0.62", start: 880, end: 885 }
          - { fmt: "9x16", seg: "s5a-02", res_x: 540, res_y: 960, lensk: "0.62", start: 886, end: 891 }
          - { fmt: "9x16", seg: "s5a-03", res_x: 540, res_y: 960, lensk: "0.62", start: 892, end: 897 }
          - { fmt: "9x16", seg: "s5a-04", res_x: 540, res_y: 960, lensk: "0.62", start: 898, end: 903 }
          - { fmt: "9x16", seg: "s5b-01", res_x: 540, res_y: 960, lensk: "0.62", start: 960, end: 965 }
          - { fmt: "9x16", seg: "s5b-02", res_x: 540, res_y: 960, lensk: "0.62", start: 966, end: 971 }
          - { fmt: "9x16", seg: "s5b-03", res_x: 540, res_y: 960, lensk: "0.62", start: 972, end: 977 }
          - { fmt: "9x16", seg: "s5b-04", res_x: 540, res_y: 960, lensk: "0.62", start: 978, end: 983 }
    env:
      FS_SAMPLES: "6"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core
          ldconfig -p | grep libEGL

      - name: Restore cached Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.5.3-linux-x64
          key: blender-4.5.3-linux-x64

      - name: Download Blender 4.5.3 LTS (cache miss only, with retries)
        # Pelajaran Ep 1 run 44600190210: download.blender.org sempat mengembalikan
        # halaman error 61 KB (bukan tarball ~300 MB) 3x berturut-turut — curl tanpa
        # -f menganggapnya sukses. Fix: curl -f, cek ukuran >200 MB sebelum tar,
        # fallback mirror OCF Berkeley.
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
            "https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
          )
          OK=0
          for URL in "${URLS[@]}"; do
            for i in 1 2 3; do
              echo "Download attempt $i from $URL"
              if curl -fSL --retry 3 --retry-delay 10 --retry-all-errors \
                  -o blender.tar.xz "$URL" \
                  && [ "$(stat -c%s blender.tar.xz)" -gt 200000000 ] \
                  && tar -tf blender.tar.xz >/dev/null; then
                echo "Download OK: $URL attempt $i ($(stat -c%s blender.tar.xz) bytes)"
                OK=1
                break 2
              fi
              echo "Download attempt $i from $URL failed, retrying in 30s..."
              rm -f blender.tar.xz
              sleep 30
            done
          done
          if [ "$OK" != 1 ]; then echo "FAIL: Blender download failed (primer + mirror)"; exit 1; fi
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render 6 frames
        run: |
          START=${{ matrix.start }}
          END=${{ matrix.end }}
          echo "Chunk ${{ matrix.fmt }}-${{ matrix.seg }}: frames $START-$END (cache-hit=${{ steps.cache-blender.outputs.cache-hit }})"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline-nexus/animate_nexus.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan pipeline-nexus/plan.json \
            --res ${{ matrix.res_x }} ${{ matrix.res_y }} --lensk ${{ matrix.lensk }} || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "CHUNK=${{ matrix.fmt }}-${{ matrix.seg }} CACHE_HIT=${{ steps.cache-blender.outputs.cache-hit }} FRAMES=$N/6 SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt 6 ]; then echo "FAIL: only $N/6 frames rendered"; exit 1; fi

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ep3-frames-${{ matrix.fmt }}-${{ matrix.seg }}
          path: out/f_*.png
          if-no-files-found: error
